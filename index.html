<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>애니팡 스타일 퍼즐 게임</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="game-container">
        <header class="game-header">
            <h1>🎮 매치 퍼즐</h1>
            <div class="score-board">
                <div class="score-item">
                    <span class="score-label">점수</span>
                    <span class="score-value" id="score">0</span>
                </div>
                <div class="score-item">
                    <span class="score-label">콤보</span>
                    <span class="score-value combo" id="combo">x1</span>
                </div>
            </div>
            <div class="timer-container">
                <div class="timer-bar">
                    <div class="timer-fill" id="timerFill"></div>
                </div>
                <span class="timer-text" id="timerText">60초</span>
            </div>
        </header>

        <main class="game-board-wrapper">
            <div class="game-board" id="gameBoard"></div>

            <!-- 게임 시작 오버레이 -->
            <div class="game-overlay" id="startOverlay">
                <div class="overlay-content">
                    <h2>🎮 매치 퍼즐</h2>
                    <p>3개 이상 같은 블록을 맞춰 점수를 획득하세요!</p>
                    <div class="special-info">
                        <p>💫 <strong>4개 매치</strong> → 터치 시 랜덤 라인 삭제</p>
                        <p>💣 <strong>L/T 모양(5개)</strong> → 터치 시 3x3 범위 펑!</p>
                        <p>⚡ <strong>5개 매치</strong> → 터치 시 무작위 동물 전체 삭제</p>
                    </div>

                    <div class="input-group">
                        <input type="text" id="playerNameInput" placeholder="닉네임을 입력하세요" maxlength="8">
                    </div>

                    <button class="btn-start" id="startBtn">게임 시작</button>
                    <button class="btn-secondary" id="showLeaderboardBtn">🏆 랭킹 보기</button>
                </div>
            </div>

            <!-- 게임 종료 오버레이 -->
            <div class="game-overlay hidden" id="endOverlay">
                <div class="overlay-content">
                    <h2>⏱️ 시간 종료!</h2>
                    <p>최종 점수</p>
                    <div class="final-score" id="finalScore">0</div>
                    <div id="newRecordMessage" class="hidden">🎉 신기록 달성! 🎉</div>
                    <button class="btn-start" id="restartBtn">다시 하기</button>
                    <button class="btn-secondary" id="endShowLeaderboardBtn">🏆 랭킹 보기</button>
                </div>
            </div>

            <!-- 리더보드 오버레이 -->
            <div class="game-overlay hidden" id="leaderboardOverlay">
                <div class="overlay-content leaderboard-content">
                    <h2>🏆 명예의 전당</h2>
                    <div class="leaderboard-list" id="leaderboardList">
                        <div class="loading">불러오는 중...</div>
                    </div>
                    <button class="btn-secondary" id="closeLeaderboardBtn">닫기</button>
                </div>
            </div>
        </main>

        <footer class="game-footer">
            <p class="hint">블록을 스와이프하거나 클릭해서 맞추세요!</p>
        </footer>
    </div>

    <script type="module" src="game.js"></script>
</body>

</html>
