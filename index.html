<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>애니팡 스타일 퍼즐 게임</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="game-container">
        <header class="game-header">
            <h1>🎮 매치 퍼즐</h1>
            <div class="score-board">
                <div class="score-item">
                    <span class="score-label">점수</span>
                    <span class="score-value" id="score">0</span>
                </div>
                <div class="score-item">
                    <span class="score-label">콤보</span>
                    <span class="score-value combo" id="combo">x1</span>
                </div>
            </div>
            <div class="timer-container">
                <div class="timer-bar">
                    <div class="timer-fill" id="timerFill"></div>
                </div>
                <span class="timer-text" id="timerText">60초</span>
            </div>
        </header>

        <main class="game-board-wrapper">
            <div class="game-board" id="gameBoard"></div>

            <!-- 게임 시작 오버레이 -->
            <div class="game-overlay" id="startOverlay">
                <div class="overlay-content">
                    <h2>🎮 매치 퍼즐</h2>
                    <div class="input-group">
                        <input type="text" id="playerNameInput" placeholder="닉네임을 입력하세요" maxlength="10">
                    </div>
                    <div class="btn-group">
                        <button class="btn-start" id="startBtn">게임 시작</button>
                        <button class="btn-secondary" id="showLeaderboardBtn">🏆 랭킹 보기</button>
                        <button class="btn-icon" id="helpBtn" title="게임 설명">❓</button>
                    </div>
                </div>
            </div>

            <!-- 게임 종료 오버레이 -->
            <div class="game-overlay hidden" id="endOverlay">
                <div class="overlay-content">
                    <h2>⏱️ 시간 종료!</h2>
                    <p>최종 점수</p>
                    <div class="final-score" id="finalScore">0</div>

                    <div id="newRecordMessage" class="hidden">🎉 현 시즌 1등 달성! 🎉</div>

                    <!-- 1등 소감 입력 (평소엔 숨김) -->
                    <div id="championInputArea" class="hidden">
                        <p style="color: #ffd700; margin-bottom: 8px;">👑 명예의 전당에 남길 한마디 👑</p>
                        <input type="text" id="championMessageInput" placeholder="소감을 입력해주세요 (20자 이내)" maxlength="20">
                    </div>

                    <button class="btn-start" id="submitScoreBtn">점수 등록</button>
                    <button class="btn-secondary" id="endShowLeaderboardBtn">🏆 랭킹 보기</button>
                    <button class="btn-secondary" id="restartBtn"
                        style="margin-top: 8px; background: rgba(255, 255, 255, 0.1); font-size: 0.9rem;">다시 하기</button>
                </div>
            </div>

            <!-- 리더보드 오버레이 -->
            <div class="game-overlay hidden" id="leaderboardOverlay">
                <div class="overlay-content leaderboard-content">
                    <h2>🏆 명예의 전당</h2>

                    <!-- 챔피언 메시지 표시 영역 -->
                    <div id="championSection" class="champion-section hidden">
                        <div class="champion-crown">👑 1st 챔피언의 한마디</div>
                        <div class="champion-msg" id="championMessageDisplay">"애니팡은 실력이다"</div>
                        <div class="champion-name" id="championNameDisplay">- 홍길동님 -</div>
                    </div>

                    <div class="leaderboard-list" id="leaderboardList">
                        <div class="loading">불러오는 중...</div>
                    </div>
                    <button class="btn-secondary" id="closeLeaderboardBtn">닫기</button>
                </div>
            </div>

            <!-- 도움말 오버레이 -->
            <div class="game-overlay hidden help-overlay" id="helpOverlay">
                <div class="overlay-content help-content">
                    <h2>❓ 게임 설명</h2>
                    <div class="help-grid">
                        <div class="help-item">
                            <span class="help-icon">🐶</span>
                            <p>3개 매치<br>점수 획득</p>
                        </div>
                        <div class="help-item">
                            <span class="help-icon">💎</span>
                            <p>4개 매치<br>라인 삭제</p>
                        </div>
                        <div class="help-item">
                            <span class="help-icon">💣</span>
                            <p>L/T (5개)<br>3x3 폭발</p>
                        </div>
                        <div class="help-item">
                            <span class="help-icon">⚡</span>
                            <p>5개 매치<br>전체 삭제</p>
                        </div>
                    </div>

                    <div class="help-tips">
                        <p>💡 <strong>Tip</strong>: 특수 블록끼리 교환하면<br>즉시 발동하여 콤보 효과!</p>
                    </div>

                    <button class="btn-secondary" id="closeHelpBtn">닫기</button>
                </div>
            </div>
        </main>

        <footer class="game-footer">
            <p class="hint">블록을 스와이프하거나 클릭해서 맞추세요!</p>
        </footer>
    </div>

    <script type="module" src="game.js"></script>
</body>

</html>
